[package]
name = "maildir-index"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "Index Maildir trees (mbsync/isync) into PostgreSQL"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
html2text = "0.17"
mail-parser = "0.11"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate", "chrono", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
# Not used directly. sqlx-postgres 0.9.0 depends on whoami without default features, which
# builds its stub backend: with PGUSER unset it would connect as "anonymous" instead of the
# OS user (the libpq default). Enabling "std" here selects the real backend.
whoami = { version = "2", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
# Placeholder: set the real one at build time with `cargo deb --maintainer "..."`.
maintainer = "maildir-index maintainers <maintainers@example.org>"
section = "mail"
priority = "optional"
depends = "$auto, adduser, systemd"
extended-description = """\
Walks Maildir trees written by mbsync/isync and indexes them into PostgreSQL: \
parsed headers plus a text rendering of each body. The Maildir is only read. \
Installs a oneshot service and a timer; enables nothing."""
maintainer-scripts = "debian/"
assets = [
    ["target/release/maildir-index", "usr/bin/", "755"],
    ["debian/maildir-index-load.service", "usr/lib/systemd/system/", "644"],
    ["debian/maildir-index-load.timer", "usr/lib/systemd/system/", "644"],
    ["example.toml", "usr/share/doc/maildir-index/config.example.toml", "644"],
    ["debian/default.example", "usr/share/doc/maildir-index/", "644"],
    ["debian/README.deploy.md", "usr/share/doc/maildir-index/", "644"],
]
