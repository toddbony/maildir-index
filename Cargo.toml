[package]
name = "maildir-index"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Index Maildir trees (mbsync/isync) into PostgreSQL"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
html2text = "0.17"
mail-parser = "0.11"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate", "chrono", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
